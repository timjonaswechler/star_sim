[package]
name = "star_sim"
version = "0.1.0"
edition = "2024"

[workspace]
resolver = "3"
members = [
    ".",
    "apps/bevy_viewer",
    "apps/population_lab",
    "crates/physics/units",
    "crates/simulation_core",
    "crates/utilities/name_generator",
]
default-members = [
    "apps/bevy_viewer",
    "apps/population_lab",
    "crates/simulation_core",
]

[dependencies]
bevy = { version = "0.19", features = ["bevy_feathers"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
rand = "0.8"
rand_chacha = "0.3"
once_cell = "1.21.3"
lazy_static = "1.4.0"
paste = "1.0"

# Local crates
units = { path = "crates/physics/units", features = ["serde"] }
name_generator = { path = "crates/utilities/name_generator" }

[[example]]
name = "color"
path = "examples/color.rs"
