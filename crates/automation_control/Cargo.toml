[package]
name = "automation_control"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
# Controller-side process/configuration utilities for tools such as star_sim_debug.
driver = ["dep:toml"]

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = ["bevy_input_focus", "bevy_ui", "bevy_picking", "bevy_window", "debug"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = { version = "0.8", optional = true }

[[example]]
name = "bevy_controller"
required-features = ["driver"]

[[test]]
name = "driver_recording"
required-features = ["driver"]

[[test]]
name = "issue_report"
required-features = ["driver"]

[[test]]
name = "github_report"
required-features = ["driver"]
