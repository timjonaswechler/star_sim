name: Automation control

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reusable-headless:
    name: Reusable headless automation driver
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests and app feature checks
        run: |
          cargo test -p automation_control --features driver -p star_sim_debug
          cargo check -p app
          cargo check -p app --features automation-control
      - name: Build reusable headless process outside the protocol timeout
        run: cargo build -p automation_control --example automation_control_headless
      - name: Exercise reusable headless driver through the protocol seam
        run: cargo test -p automation_control --features driver --test driver_recording -- --nocapture

  visual-linux:
    name: Visual Linux automation E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Bevy Linux build dependencies and Mesa Vulkan software rendering
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config xvfb libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libasound2-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb-xfixes0-dev libgl1-mesa-dri \
            mesa-vulkan-drivers vulkan-tools
      - name: Build apps/app process outside the protocol timeout
        run: |
          cargo build -p star_sim_debug
          cargo build -p app --features automation-control
      - name: Run apps/app logical and visual flows under Xvfb
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WGPU_FORCE_FALLBACK_ADAPTER: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts/debug-ci
          xvfb-run -a -s "-screen 0 1280x720x24" \
            cargo run -q -p star_sim_debug -- \
              --config apps/star_sim_debug/config/automation/debug.toml \
              logical --artifact-dir artifacts/debug-ci/logical \
            | tee artifacts/debug-ci/logical-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          values = []
          for line in Path("artifacts/debug-ci/logical-result.json").read_text().splitlines():
              try:
                  value = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict) and value.get("status") == "passed":
                  values.append(value)
          assert len(values) == 1, f"expected one logical result, got {values!r}"
          assert values[0]["mode"] == "logical"
          assert values[0]["state"]["active_screen"] == "museum"
          PY
          xvfb-run -a -s "-screen 0 1280x720x24" \
            cargo run -q -p star_sim_debug -- \
              --config apps/star_sim_debug/config/automation/debug.toml \
              visual --artifact-dir artifacts/debug-ci \
            | tee artifacts/debug-ci/result.json
          python3 - <<'PY'
          import json, struct
          from pathlib import Path
          lines = Path("artifacts/debug-ci/result.json").read_text().splitlines()
          results = []
          for line in lines:
              try:
                  value = json.loads(line)
              except json.JSONDecodeError:
                  continue
              if isinstance(value, dict) and value.get("status") == "passed":
                  results.append(value)
          assert len(results) == 1, f"expected one successful result, got {results!r}"
          result = results[0]
          assert result["mode"] == "visual"
          data = Path("artifacts/debug-ci", "window.png").read_bytes()
          assert data[:8] == b"\x89PNG\r\n\x1a\n"
          assert struct.unpack(">II", data[16:24]) == (640, 360)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-control-visual-linux
          path: artifacts/debug-ci/
          if-no-files-found: warn
