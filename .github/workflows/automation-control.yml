name: Automation control

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    name: Display-free protocol and driver checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Bevy Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libasound2-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb-xfixes0-dev
      - name: Build the logical app outside the session timeout
        run: cargo build -p app --features automation-control
      - name: Run display-free protocol, driver, and Debug Host tests
        run: |
          cargo test -p bug_hunter
          cargo test -p bug_hunter --features driver
          cargo test -p star_sim_debug

  rendered-linux:
    name: Rendered Linux automation E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Bevy Linux build dependencies and Mesa Vulkan software rendering
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            g++ pkg-config xauth xvfb libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libasound2-dev libudev-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb-xfixes0-dev libgl1-mesa-dri \
            mesa-vulkan-drivers vulkan-tools
      - name: Check desktop Bevy applications
        run: |
          cargo check -p app
          cargo check -p app --features automation-control
          cargo check -p bevy_test_apps
          cargo check -p bevy_test_apps --features automation
          ! cargo tree -p app -e normal --prefix none | grep '^bug_hunter '
      - name: Build the rendered host, app, and controller outside protocol timeouts
        run: |
          cargo build -p app --features automation-control
          cargo build -p star_sim_debug
          cargo build -p bug_hunter --example bevy_controller --features driver
      - name: Run the rendered REPL and screenshot controller under Xvfb
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          WGPU_FORCE_FALLBACK_ADAPTER: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts/debug-ci/repl
          printf 'click menu.tab.museum\nquit\n' \
            | timeout 5m xvfb-run -a -s "-screen 0 1280x720x24" \
                target/debug/star_sim_debug \
                  --mode rendered --artifact-dir artifacts/debug-ci/repl \
            | tee artifacts/debug-ci/rendered-repl.txt
          grep -F 'instance=alpha mode=rendered screen=museum paused=false' \
            artifacts/debug-ci/rendered-repl.txt
          grep -F 'last action: click menu.tab.museum' \
            artifacts/debug-ci/rendered-repl.txt
          ! grep -E '"(sequence|version)"|"type":"ready"|"status":"completed"' \
            artifacts/debug-ci/rendered-repl.txt
          timeout 5m xvfb-run -a -s "-screen 0 1280x720x24" \
            target/debug/examples/bevy_controller \
            2>&1 | tee artifacts/debug-ci/rendered-controller.log
          printf 'rendered controller and screenshot smoke passed\n' \
            > artifacts/debug-ci/rendered-controller-status.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-control-rendered-linux
          path: artifacts/debug-ci/
          if-no-files-found: warn
